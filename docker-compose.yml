services:
  web:
    build: .
    container_name: fabrioza-web
    restart: unless-stopped
    # Contact-form SMTP (sends through the cPanel mail server).
    # Set SMTP_PASS in a .env file next to this compose file on the server:
    #   echo 'SMTP_PASS=the-mailbox-password' > .env
    environment:
      # Resend (HTTPS, port 443) is tried FIRST by fab_send(); SMTP below is
      # the fallback. A variable only reaches the container if it is listed
      # HERE - compose reads .env for substitution, nothing more. The key sat
      # correctly in .env for a day and never reached PHP because of that.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-info@fabrioza.com}
      RESEND_FROM_NAME: ${RESEND_FROM_NAME:-FABRIOZA}
      SMTP_HOST: ${SMTP_HOST:-smtp.hostinger.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-sales@fabrioza.com}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_TO: ${MAIL_TO:-sales@fabrioza.com}
      CRM_IP_SALT: ${CRM_IP_SALT:-}
      CRM_RATE_MAX: ${CRM_RATE_MAX:-3}
      RECAPTCHA_SECRET: ${RECAPTCHA_SECRET:-}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASS_HASH: ${ADMIN_PASS_HASH:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      CRM_INBOX_SKIP: ${CRM_INBOX_SKIP:-}
    volumes:
      # CRM SQLite database - OUTSIDE the web root, survives rebuilds
      - crm_data:/var/data
    ports:
      # Put your SSL-terminating reverse proxy (Caddy / nginx / Traefik) in
      # front of this port. The proxy MUST forward X-Forwarded-Proto: https
      # (all three do by default) - dist/.htaccess uses it to avoid a
      # redirect loop on the HTTPS 301.
      # Override the host port per machine via .env (WEB_PORT=8085 on the
      # VPS, where 8080 is taken) so git pull never conflicts.
      - "${WEB_PORT:-8080}:80"

volumes:
  crm_data:
